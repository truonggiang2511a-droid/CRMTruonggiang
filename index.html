<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RE OS AI PRO — AI Sales OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0f172a}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.97);backdrop-filter:blur(14px)}#card{width:min(400px,100%);background:#fff;border-radius:28px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.4)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#6366f1);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#4f46e5}.title{font-size:21px;font-weight:900;color:#0f172a;margin-top:2px}.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:14px;margin-bottom:18px}.tabs button{flex:1;border:0;border-radius:10px;padding:11px;background:transparent;color:#64748b;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:#4f46e5;box-shadow:0 2px 8px rgba(15,23,42,.08)}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;color:#334155;margin:0 0 6px}.field input{display:block;width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px 14px;font-size:14px;outline:none}.field input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}#submit{width:100%;border:0;border-radius:14px;padding:14px;background:#4f46e5;color:#fff;font-weight:900;font-size:14px;cursor:pointer}#submit:disabled{opacity:.65}#msg{min-height:20px;margin:7px 0 8px;font-size:12px;font-weight:800;color:#dc2626}#msg.ok{color:#059669}.hint{text-align:center;color:#64748b;font-size:11px;line-height:1.55;margin-top:14px}#resend{display:none;width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:12px;padding:11px;background:#fff;color:#334155;font-weight:800;font-size:12px;cursor:pointer}#bar{position:fixed;right:14px;top:14px;z-index:110;display:none;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800;color:#334155;box-shadow:0 8px 24px rgba(15,23,42,.18)}#logout{margin-left:8px;border:0;border-radius:9px;padding:6px 9px;background:#fee2e2;color:#dc2626;font-size:10px;font-weight:900;cursor:pointer}.cloud{position:fixed;left:14px;top:14px;z-index:110;display:none;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}
</style>
</head>
<body>
<iframe id="frame" src="/legacy.html" title="RE OS AI PRO"></iframe>
<div id="cloudBadge" class="cloud">☁ AI SALES OS</div><div id="bar"><span id="who"></span><button id="logout" type="button">Đăng xuất</button></div>
<div id="gate"><div id="card"><div class="brand"><div class="logo">⌂</div><div><div class="eyebrow">AI SALES OS</div><div class="title">RE OS AI PRO</div></div></div><div class="tabs"><button id="loginTab" class="active">Đăng nhập</button><button id="signupTab">Tạo tài khoản</button></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" minlength="6" autocomplete="current-password"></div><div class="field" id="nameWrap" style="display:none"><label>Tên môi giới</label><input id="name" type="text"></div><div id="msg"></div><button id="submit">Đăng nhập</button><button id="resend">Gửi lại email xác nhận</button><div class="hint">CRM tập trung vào việc bán hàng: lead → nhu cầu → căn phù hợp → follow-up → giao dịch.</div></div></div>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://crzinaydjgqepffatqoo.supabase.co',SUPABASE_KEY='sb_publishable_NhyivL-3owNWC6unb8GbZA_d135dx3i';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
const $=id=>document.getElementById(id),frame=$('frame'),gate=$('gate'),bar=$('bar'),cloud=$('cloudBadge'),who=$('who'),msg=$('msg'),submit=$('submit'),resend=$('resend'),email=$('email'),password=$('password'),name=$('name'),nameWrap=$('nameWrap');let mode='login';
function setMsg(t,ok=false){msg.textContent=t||'';msg.className=ok?'ok':''} function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');nameWrap.style.display=m==='login'?'none':'block';submit.textContent=m==='login'?'Đăng nhập':'Tạo tài khoản';setMsg('');resend.style.display='none'}
loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');[email,password,name].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()}));
async function ensureProfile(u){try{await sb.from('crm_profiles').upsert({user_id:u.id,display_name:u.user_metadata?.full_name||u.email?.split('@')[0]||'Môi giới'},{onConflict:'user_id'})}catch(e){}}
async function auth(){setMsg('');resend.style.display='none';submit.disabled=true;try{const e=email.value.trim(),p=password.value.trim();if(!e||!p)throw Error('Vui lòng nhập email và mật khẩu.');const r=mode==='login'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p,options:{data:{full_name:name.value.trim()||e.split('@')[0]},emailRedirectTo:location.origin+'/'}});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){setMsg('Tài khoản đã tạo nhưng cần xác nhận email trong Supabase.',true);resend.style.display='block';return}if(!r.data.user)throw Error('Không nhận được tài khoản.');await ensureProfile(r.data.user);show(r.data.user)}catch(e){setMsg(e.message||'Không thể đăng nhập.')}finally{submit.disabled=false}}
submit.onclick=auth;resend.onclick=async()=>{const e=email.value.trim();if(!e)return setMsg('Nhập email trước.');const r=await sb.auth.resend({type:'signup',email:e,options:{emailRedirectTo:location.origin+'/'}});if(r.error)setMsg(r.error.message);else setMsg('Đã gửi lại email xác nhận.',true)};
logout.onclick=async()=>{await sb.auth.signOut();location.reload()};
function show(u){gate.style.display='none';bar.style.display='block';cloud.style.display='block';who.textContent=u?.email||'';frame.style.display='block';setTimeout(enhance,250)}
function gateShow(){gate.style.display='flex';bar.style.display='none';cloud.style.display='none';frame.style.display='block'}
loginTab=$('loginTab');signupTab=$('signupTab');sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')gateShow();else if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&s?.user)show(s.user)});gateShow();setMode('login');
const norm=v=>String(v||'').trim().toLowerCase(), days=ts=>ts?Math.max(0,Math.floor((Date.now()-Number(ts))/86400000)):999;
const doneKey=(type,id)=>`reos-v2-${type}-${id}`;const done=(t,id)=>localStorage.getItem(doneKey(t,id))==='1';
function finish(t,id){localStorage.setItem(doneKey(t,id),'1');enhance()}
function bestMatch(c,ps){let best=null;for(const p of ps){let s=0,cl=norm(c.location),pd=norm(p.district);if(cl&&pd&&(pd.includes(cl)||cl.includes(pd)))s+=55;else if(cl&&pd&&cl.split(/[ ,.-]+/).some(x=>x.length>2&&pd.includes(x)))s+=25;const b=+c.budgetVnd||0,pr=+p.priceVnd||0;if(b&&pr){if(pr<=b)s+=35;else if(pr<=b*1.1)s+=20;else if(pr<=b*1.2)s+=8}if(!best||s>best.score)best={p,score:Math.min(100,s)}}return best}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function launch(fn,arg){try{fn(arg)}catch(e){}}
function enhance(){try{const w=frame.contentWindow,d=w.document,S=w.State;if(!S||!d.getElementById('home-ai-brief-content'))return setTimeout(enhance,500);const cs=[...(S.customers||[])],ps=[...(S.properties||[])];const hot=cs.filter(c=>c.stage==='hot').sort((a,b)=>(b.score||0)-(a.score||0));const stale=cs.filter(c=>days(c.updatedAt)>=3).sort((a,b)=>days(b.updatedAt)-days(a.updatedAt));const matches=cs.map(c=>({c,b:bestMatch(c,ps)})).filter(x=>x.b&&x.b.score>=55).sort((a,b)=>(b.b.score+(b.c.score||0))-(a.b.score+(a.c.score||0)));
let tasks=[];hot.slice(0,4).forEach(c=>tasks.push({t:'call',id:c.id,p:95,title:`Gọi ${c.name}`,desc:`Lead nóng • ${c.location||'chưa rõ khu vực'} • ${c.budgetDisplay||'chưa rõ ngân sách'}`,cta:'Gọi',go:`location.href='tel:${esc(c.phone||'')}'`}));matches.slice(0,3).forEach(x=>tasks.push({t:'match',id:x.c.id,p:x.b.score,title:`Gửi ${x.b.p.code||'căn phù hợp'} cho ${x.c.name}`,desc:`Match ${x.b.score}% • ${x.b.p.priceDisplay||'Liên hệ'} • ${x.b.p.district||''}`,cta:'Mở căn',go:`parent.launch(parent.frame.contentWindow.Actions.openPropertyDetail,'${esc(x.b.p.id)}')`}));stale.slice(0,3).forEach(c=>tasks.push({t:'follow',id:c.id,p:60,title:`Follow-up ${c.name}`,desc:`Đã ${days(c.updatedAt)} ngày chưa cập nhật`,cta:'Mở khách',go:`parent.launch(parent.frame.contentWindow.FormControllers.openCustomerForm,'${esc(c.id)}')`}));tasks.sort((a,b)=>b.p-a.p);const active=tasks.filter(x=>!done(x.t,x.id)).slice(0,6),doneN=tasks.filter(x=>done(x.t,x.id)).length;
const root=d.getElementById('home-ai-brief-content');let h=`<div class="bg-white/10 p-3 rounded-2xl border border-white/10"><div style="font-size:10px;font-weight:900;color:#c7d2fe;letter-spacing:.08em">AI SALES BRIEF • ${new Date().toLocaleDateString('vi-VN')}</div><div style="font-size:18px;font-weight:900;color:#fff;margin-top:4px">${cs.length?`Hôm nay tập trung ${Math.max(1,active.length)} việc có khả năng tạo giao dịch.`:'Thêm khách và kho để AI lập kế hoạch.'}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px"><div style="background:rgba(255,255,255,.08);padding:8px;border-radius:12px"><b style="font-size:18px">${hot.length}</b><div style="font-size:9px;color:#cbd5e1">Lead nóng</div></div><div style="background:rgba(255,255,255,.08);padding:8px;border-radius:12px"><b style="font-size:18px">${matches.length}</b><div style="font-size:9px;color:#cbd5e1">Match tốt</div></div><div style="background:rgba(255,255,255,.08);padding:8px;border-radius:12px"><b style="font-size:18px">${stale.length}</b><div style="font-size:9px;color:#cbd5e1">Follow-up</div></div><div style="background:rgba(255,255,255,.08);padding:8px;border-radius:12px"><b style="font-size:18px">${doneN}</b><div style="font-size:9px;color:#cbd5e1">Đã xong</div></div></div></div>`;
if(!active.length)h+=`<div class="bg-emerald-50 text-emerald-800 p-4 rounded-[20px] text-xs font-bold border border-emerald-100" style="margin-top:8px">✅ Hết việc ưu tiên. Cập nhật thêm lead hoặc kho để AI phân tích tiếp.</div>`;
active.forEach((x,i)=>h+=`<div class="bg-white p-4 rounded-[20px] shadow-lg text-slate-900 border-l-4 ${i===0?'border-primary':'border-slate-200'}" style="margin-top:8px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-size:9px;font-weight:900;color:#fff;background:${i===0?'#4f46e5':'#64748b'};padding:5px 8px;border-radius:7px">${i===0?'ƯU TIÊN #1':'#'+(i+1)}</span><span style="font-size:9px;font-weight:900;color:#059669;background:#ecfdf5;padding:5px 8px;border-radius:7px">AI ${x.p}%</span></div><div style="font-size:13px;font-weight:900;margin-top:8px">${esc(x.title)}</div><div style="font-size:10px;color:#64748b;font-weight:700;margin-top:4px;line-height:1.5">${esc(x.desc)}</div><div style="display:flex;gap:7px;margin-top:9px"><button onclick="${x.go}" style="flex:1;border:0;background:#0f172a;color:#fff;padding:9px;border-radius:11px;font-size:10px;font-weight:900">${x.cta}</button><button onclick="parent.finish('${x.t}','${esc(x.id)}')" style="width:38px;border:0;background:#ecfdf5;color:#059669;border-radius:11px;font-size:12px;font-weight:900">✓</button></div></div>`);root.innerHTML=h;
const home=d.getElementById('view-home');if(home&&!d.getElementById('ai-goals-panel')){const panel=d.createElement('div');panel.id='ai-goals-panel';panel.className='bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm';panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><h3 class="font-bold text-slate-800 text-xs uppercase tracking-wider">AI Mục Tiêu Hôm Nay</h3><p style="margin:4px 0 0;font-size:10px;color:#64748b">Tập trung vào 3 hành động tạo doanh thu.</p></div><span style="font-size:10px;font-weight:900;color:#4f46e5;background:#eef2ff;padding:6px 8px;border-radius:999px">SALES FOCUS</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px"><button onclick="parent.finish('goal','contact')" style="border:1px solid #e2e8f0;background:#fff;border-radius:14px;padding:11px;font-size:10px;font-weight:800">📞 5 Cuộc gọi</button><button onclick="parent.finish('goal','match')" style="border:1px solid #e2e8f0;background:#fff;border-radius:14px;padding:11px;font-size:10px;font-weight:800">🏠 3 Match</button><button onclick="parent.finish('goal','content')" style="border:1px solid #e2e8f0;background:#fff;border-radius:14px;padding:11px;font-size:10px;font-weight:800">📣 1 Nội dung</button></div>`;home.appendChild(panel)}}catch(e){console.warn(e)}}
frame.addEventListener('load',()=>setTimeout(enhance,300));
})();
</script>
<script src="/ai-deal-closer.js"></script>
<script src="/reos-premium.js"></script>
</body></html>
