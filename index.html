<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RE OS AI PRO — CRM Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0f172a}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.97);backdrop-filter:blur(14px)}
#card{width:min(400px,100%);background:#fff;border-radius:28px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#6366f1);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#4f46e5}.title{font-size:21px;font-weight:900;color:#0f172a;margin-top:2px}
.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:14px;margin-bottom:18px}.tabs button{flex:1;border:0;border-radius:10px;padding:11px;background:transparent;color:#64748b;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:#4f46e5;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;color:#334155;margin:0 0 6px}.field input{display:block;width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px 14px;font-size:14px;outline:none}.field input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
#submit{width:100%;border:0;border-radius:14px;padding:14px;background:#4f46e5;color:#fff;font-weight:900;font-size:14px;cursor:pointer}#submit:disabled{opacity:.65;cursor:wait}
#msg{min-height:20px;margin:7px 0 8px;font-size:12px;font-weight:800;color:#dc2626}#msg.ok{color:#059669}.hint{text-align:center;color:#64748b;font-size:11px;line-height:1.55;margin-top:14px}
#resend{display:none;width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:12px;padding:11px;background:#fff;color:#334155;font-weight:800;font-size:12px;cursor:pointer}#bar{position:fixed;right:14px;top:14px;z-index:90;display:none;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800;color:#334155;box-shadow:0 8px 24px rgba(15,23,42,.18)}#logout{margin-left:8px;border:0;border-radius:9px;padding:6px 9px;background:#fee2e2;color:#dc2626;font-size:10px;font-weight:900;cursor:pointer}
.cloud{position:fixed;left:14px;top:14px;z-index:90;display:none;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}
</style>
</head>
<body>
<iframe id="frame" src="/legacy.html" title="RE OS AI PRO"></iframe>
<div id="cloudBadge" class="cloud">☁ CRM CLOUD</div>
<div id="bar"><span id="who"></span><button id="logout" type="button">Đăng xuất</button></div>
<div id="gate"><div id="card">
  <div class="brand"><div class="logo">⌂</div><div><div class="eyebrow">CRM CLOUD</div><div class="title">RE OS AI PRO</div></div></div>
  <div class="tabs"><button id="loginTab" class="active" type="button">Đăng nhập</button><button id="signupTab" type="button">Tạo tài khoản</button></div>
  <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="email@cuaban.com"></div>
  <div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="Tối thiểu 6 ký tự"></div>
  <div class="field" id="nameWrap" style="display:none"><label for="name">Tên môi giới</label><input id="name" type="text" placeholder="Tên hiển thị"></div>
  <div id="msg"></div><button id="submit" type="button">Đăng nhập</button><button id="resend" type="button">Gửi lại email xác nhận</button>
  <div class="hint">Dữ liệu khách hàng và kho BĐS được lưu cloud, tách riêng theo tài khoản.</div>
</div></div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://crzinaydjgqepffatqoo.supabase.co';
const SUPABASE_KEY='sb_publishable_NhyivL-3owNWC6unb8GbZA_d135dx3i';
const APP_URL='https://crm-truonggiang.vercel.app/';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.__sb=sb;
const $=id=>document.getElementById(id), gate=$('gate'), frame=$('frame'), bar=$('bar'), cloud=$('cloudBadge'), who=$('who'), msg=$('msg'), submit=$('submit'), resend=$('resend');
const email=$('email'), password=$('password'), name=$('name'), nameWrap=$('nameWrap'), loginTab=$('loginTab'), signupTab=$('signupTab'), logout=$('logout');
let mode='login', currentUser=null, frameReady=false, booted=false;
function setMsg(text,ok=false){msg.textContent=text||'';msg.className=ok?'ok':'';}
function setMode(next){mode=next;const login=next==='login';loginTab.classList.toggle('active',login);signupTab.classList.toggle('active',!login);nameWrap.style.display=login?'none':'block';submit.textContent=login?'Đăng nhập':'Tạo tài khoản';setMsg('');resend.style.display='none';}
loginTab.addEventListener('click',()=>setMode('login'));signupTab.addEventListener('click',()=>setMode('signup'));
[email,password,name].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit.click()}}));
function showCloud(){gate.style.display='none';bar.style.display='block';cloud.style.display='block';who.textContent=currentUser?.email||'';}
function showGate(){gate.style.display='flex';bar.style.display='none';cloud.style.display='none';}
function waitFrame(){if(frameReady&&frame.contentWindow?.DB)return Promise.resolve(frame.contentWindow);return new Promise((resolve,reject)=>{const start=Date.now();const poll=()=>{const w=frame.contentWindow;if(w?.DB?.getAll&&w?.State){frameReady=true;resolve(w);return}if(Date.now()-start>10000){reject(new Error('Giao diện CRM chưa sẵn sàng. Hãy tải lại trang.'));return}setTimeout(poll,100)};poll()})}
async function bridge(user){currentUser=user;const w=await waitFrame();
const localC=await w.DB.getAll('customers');const localP=await w.DB.getAll('properties');
const price=v=>{const n=Number(v||0);if(!n)return'Liên hệ';return n>=1e9?(n/1e9).toLocaleString('vi-VN')+' TỶ':n.toLocaleString('vi-VN')+' VNĐ'};
const save=async(store,d)=>{const customer=store==='customers',table=customer?'crm_customers':'crm_properties';const id=/^[0-9a-f-]{36}$/i.test(d.id||'')?d.id:crypto.randomUUID();const row=customer?{id,user_id:user.id,name:d.name||'',phone:d.phone||'',stage:d.stage||'hot',budget_vnd:Number(d.budgetVnd||0),location:d.location||'',notes:d.notes||'',score:Number(d.score||70),updated_at:new Date().toISOString()}:{id,user_id:user.id,title:d.title||'',type:d.type||'Nhà phố',code:d.code||('P-'+Date.now()),price_vnd:Number(d.priceVnd||0),area:d.area??null,width:d.width??null,length:d.length??null,bedrooms:d.bedrooms??null,bathrooms:d.bathrooms??null,floors:d.floors??null,district:d.district||'',map_url:d.mapUrl||'',images:Array.isArray(d.images)?d.images:[],updated_at:new Date().toISOString()};const r=await sb.from(table).upsert(row).select('id').single();if(r.error)throw r.error;return r.data.id};
const get=async store=>{const table=store==='customers'?'crm_customers':'crm_properties';const r=await sb.from(table).select('*').order('updated_at',{ascending:false});if(r.error)throw r.error;return(r.data||[]).map(x=>store==='customers'?{id:x.id,name:x.name,phone:x.phone,stage:x.stage,budgetVnd:Number(x.budget_vnd||0),budgetDisplay:price(x.budget_vnd),location:x.location,notes:x.notes,score:x.score,updatedAt:Date.parse(x.updated_at||'')||Date.now()}:{id:x.id,title:x.title,type:x.type,code:x.code,priceVnd:Number(x.price_vnd||0),priceDisplay:price(x.price_vnd),area:x.area,width:x.width,length:x.length,bedrooms:x.bedrooms,bathrooms:x.bathrooms,floors:x.floors,district:x.district,mapUrl:x.map_url,images:Array.isArray(x.images)?x.images:[],updatedAt:Date.parse(x.updated_at||'')||Date.now()})};
const del=async(store,id)=>{const table=store==='customers'?'crm_customers':'crm_properties';const r=await sb.from(table).delete().eq('id',id);if(r.error)throw r.error};
window.__crmCloud={save,get,del};
w.DB.getAll=s=>parent.__crmCloud.get(s);w.DB.save=(s,d)=>parent.__crmCloud.save(s,d);w.DB.delete=(s,id)=>parent.__crmCloud.del(s,id);
if(!w.Auth)w.Auth={};w.Auth.session={user:{id:user.id,email:user.email,user_metadata:user.user_metadata||{}}};
const h=w.document.querySelector('header p');if(h)h.innerHTML='<i class="fa-solid fa-cloud mr-1"></i> CRM CLOUD';
if(localStorage.getItem('crm_migrated_'+user.id)!=='1'&&(localC.length||localP.length)){for(const c of localC)await save('customers',c);for(const p of localP)await save('properties',p);localStorage.setItem('crm_migrated_'+user.id,'1');}
await w.State.load();showCloud();
}
async function handleAuth(){setMsg('');resend.style.display='none';submit.disabled=true;submit.textContent=mode==='login'?'Đang đăng nhập…':'Đang tạo tài khoản…';try{
const e=email.value.trim(),p=password.value;if(!e||!p)throw new Error('Vui lòng nhập email và mật khẩu.');
let r;
if(mode==='login'){r=await sb.auth.signInWithPassword({email:e,password:p});}
else{r=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:name.value.trim()||e.split('@')[0]},emailRedirectTo:APP_URL}});}
if(r.error){if(r.error.message?.toLowerCase().includes('email not confirmed')){setMsg('Email chưa được xác nhận. Hãy mở email xác nhận rồi quay lại đăng nhập.');resend.style.display='block';return}throw r.error;}
if(!r.data.session){setMsg('Đăng ký thành công. Hãy kiểm tra email và bấm Xác nhận. Sau đó quay lại đây để đăng nhập.',true);resend.style.display='block';return;}
await bridge(r.data.user);
}catch(err){console.error(err);setMsg(err?.message||'Không thể đăng nhập.');if(err?.message?.toLowerCase().includes('email not confirmed'))resend.style.display='block';}finally{submit.disabled=false;if(gate.style.display!=='none')submit.textContent=mode==='login'?'Đăng nhập':'Tạo tài khoản';}}
submit.addEventListener('click',handleAuth);
resend.addEventListener('click',async()=>{const e=email.value.trim();if(!e){setMsg('Nhập email trước.');return}resend.disabled=true;try{const r=await sb.auth.resend({type:'signup',email:e,options:{emailRedirectTo:APP_URL}});if(r.error)throw r.error;setMsg('Đã gửi lại email xác nhận. Hãy kiểm tra hộp thư.',true);}catch(e){setMsg(e.message||'Không gửi được email.');}finally{resend.disabled=false;}});
logout.addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;showGate()}else if(session?.user&&!currentUser){bridge(session.user).catch(err=>{console.error(err);showGate()})}});
frame.addEventListener('load',async()=>{try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session?.user){await bridge(data.session.user)}else showGate();}catch(e){console.error(e);showGate();}});
setMode('login');
})();
</script>
</body>
</html>
