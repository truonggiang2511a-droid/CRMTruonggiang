sg=$('msg'),submit=$('submit'),resend=$('resend'),email=$('email'),password=$('password'),name=$('name'),nameWrap=$('nameWrap'),loginTab=$('loginTab'),signupTab=$('signupTab');const SUPABASE_URL='https://crzinaydjgqepffatqoo.supabase.co',SUPABASE_KEY='sb_publishable_NhyivL-3owNWC6unb8GbZA_d135dx3i';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});window.__REOS_SB=sb;let mode='login';function setMsg(t,ok=false){msg.textContent=t||'';msg.className=ok?'ok':''}function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');nameWrap.style.display=m==='login'?'none':'block';submit.textContent=m==='login'?'Đăng nhập':'Tạo tài khoản';setMsg('');resend.style.display='none'}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');[email,password,name].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()}));async function ensureProfile(u){try{await sb.from('crm_profiles').upsert({user_id:u.id,display_name:u.user_metadata?.full_name||u.email?.split('@')[0]||'Môi giới'},{onConflict:'user_id'})}catch{}}async function auth(){setMsg('');resend.style.display='none';submit.disabled=true;try{const e=email.value.trim(),p=password.value.trim();if(!e||!p)throw Error('Vui lòng nhập email và mật khẩu.');const r=mode==='login'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p,options:{data:{full_name:name.value.trim()||e.split('@')[0]},emailRedirectTo:location.origin+'/'}});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){setMsg('Tài khoản đã tạo nhưng cần xác nhận email trong Supabase.',true);resend.style.display='block';return}if(!r.data.user)throw Error('Không nhận được tài khoản.');await ensureProfile(r.data.user);show(r.data.user)}catch(e){setMsg(e.message||'Không thể đăng nhập.')}finally{submit.disabled=false}}submit.onclick=auth;resend.onclick=async()=>{const e=email.value.trim();if(!e)return setMsg('Nhập email trước.');const r=await sb.auth.resend({type:'signup',email:e,options:{emailRedirectTo:location.origin+'/'}});if(r.error)setMsg(r.error.message);else setMsg('Đã gửi lại email xác nhận.',true)};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};function show(u){gate.style.display='none';bar.style.display='block';cloud.style.display='block';who.textContent=u?.email||'';frame.style.display='block';setTimeout(enhance,300)}function gateShow(){gate.style.display='flex';bar.style.display='none';cloud.style.display='none'}function addScript(src){if(document.querySelector('script[src="'+src+'"]'))return;const s=document.createElement('script');s.src=src;s.defer=true;document.head.appendChild(s)}function enhance(){addScript('/reos-premium.js');addScript('/ai-deal-closer.js');addScript('/reos-retention.js');addScript('/reos-content-media.js');addScript('/reos-ai-content-v2.js')}sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')gateShow();else if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&s?.user)show(s.user)});frame.addEventListener('load',()=>setTimeout(enhance,500));gateShow();setMode('login')})();</script></body></html>
