<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RE OS AI PRO — CRM Cloud</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0f172a}#app{width:100%;height:100%}#frame{border:0;width:100%;height:100%;display:block}#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.97);backdrop-filter:blur(12px)}#card{width:100%;max-width:390px;background:#fff;border-radius:28px;padding:26px;box-sizing:border-box;box-shadow:0 25px 60px rgba(0,0,0,.35)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:#4f46e5;text-transform:uppercase}.title{font-size:20px;font-weight:800;color:#0f172a}.tabs{display:flex;background:#f1f5f9;border-radius:14px;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;background:transparent;color:#64748b;cursor:pointer}.tabs button.active{background:#fff;color:#4f46e5}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:14px;padding:13px;font-size:14px;outline:none}.submit{width:100%;border:0;border-radius:14px;padding:14px;background:#4f46e5;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.error{min-height:18px;color:#dc2626;font-size:12px;font-weight:700;margin:6px 0 10px}.ok{min-height:18px;color:#059669;font-size:12px;font-weight:700;margin:6px 0 10px}.hint{text-align:center;color:#64748b;font-size:11px;line-height:1.5;margin-top:14px}#userbar{position:fixed;right:14px;top:14px;z-index:10;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:8px 10px;font-size:11px;font-weight:700;color:#334155;box-shadow:0 8px 24px rgba(15,23,42,.15);display:none}#userbar button{margin-left:8px;border:0;background:#fee2e2;color:#dc2626;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:800;cursor:pointer}</style></head><body><div id="app"><iframe id="frame" src="../index.html"></iframe></div><div id="userbar"><span id="useremail"></span><button id="logout">Đăng xuất</button></div><div id="gate"><div id="card"><div class="brand"><div class="logo">⌂</div><div><div class="eyebrow">CRM CLOUD</div><div class="title">RE OS AI PRO</div></div></div><div class="tabs"><button id="loginTab" class="active">Đăng nhập</button><button id="signupTab">Tạo tài khoản</button></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="email@cuaban.com"></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="Tối thiểu 6 ký tự"></div><div class="field" id="nameWrap" style="display:none"><label>Tên môi giới</label><input id="name" type="text" placeholder="Tên hiển thị"></div><div id="msg" class="error"></div><button id="submit" class="submit">Đăng nhập</button><div class="hint">Dữ liệu CRM được lưu trên cloud và tách riêng theo tài khoản.</div></div></div><script>
const SUPABASE_URL='https://crzinaydjgqepffatqoo.supabase.co';
const SUPABASE_KEY='sb_publishable_NhyivL-3owNWC6unb8GbZA_d135dx3i';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const frame=document.getElementById('frame');const gate=document.getElementById('gate');const email=document.getElementById('email');const password=document.getElementById('password');const nameEl=document.getElementById('name');const msg=document.getElementById('msg');const loginTab=document.getElementById('loginTab');const signupTab=document.getElementById('signupTab');const nameWrap=document.getElementById('nameWrap');const submit=document.getElementById('submit');const userbar=document.getElementById('userbar');const useremail=document.getElementById('useremail');let mode='login';let frameReady=false;let currentUser=null;
const setMode=m=>{mode=m;const login=m==='login';loginTab.classList.toggle('active',login);signupTab.classList.toggle('active',!login);nameWrap.style.display=login?'none':'block';submit.textContent=login?'Đăng nhập':'Tạo tài khoản';msg.className='error';msg.textContent='';};loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');
const fmtVnd=v=>{const n=Number(v||0);if(!n)return'Liên hệ';return n>=1e9?(n/1e9).toLocaleString('vi-VN')+' TỶ':n.toLocaleString('vi-VN')+' VNĐ'};
function runInFrame(code){if(!frameReady)return;try{return frame.contentWindow.eval(code)}catch(e){console.error('Frame bridge error',e)}}
async function bridge(user){currentUser=user;frameReady=true;const localCustomers=runInFrame("DB.getAllLocal('customers')")||[];const localProperties=runInFrame("DB.getAllLocal('properties')")||[];runInFrame(`Auth.session=${JSON.stringify({user:{id:user.id,email:user.email,user_metadata:user.user_metadata||{}}})};DB.cloud=true;document.querySelector('header p').innerHTML='<i class="fa-solid fa-cloud mr-1"></i> CRM CLOUD';void 0`);
const dbSave=async(store,data)=>{const isC=store==='customers';const table=isC?'crm_customers':'crm_properties';const row=isC?{id:/^[0-9a-f-]{36}$/i.test(data.id||'')?data.id:crypto.randomUUID(),user_id:user.id,name:data.name,phone:data.phone,stage:data.stage||'hot',budget_vnd:Number(data.budgetVnd||0),location:data.location||'',notes:data.notes||'',score:Number(data.score||70),created_at:new Date().toISOString(),updated_at:new Date().toISOString()}:{id:/^[0-9a-f-]{36}$/i.test(data.id||'')?data.id:crypto.randomUUID(),user_id:user.id,title:data.title,type:data.type||'Nhà phố',code:data.code||('P-'+Date.now()),price_vnd:Number(data.priceVnd||0),area:data.area??null,width:data.width??null,length:data.length??null,bedrooms:data.bedrooms??null,bathrooms:data.bathrooms??null,floors:data.floors??null,district:data.district||'',map_url:data.mapUrl||'',images:Array.isArray(data.images)?data.images:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()};const {data:saved,error}=await sb.from(table).upsert(row).select().single();if(error)throw error;return saved.id};
const dbGet=async store=>{const table=store==='customers'?'crm_customers':'crm_properties';const {data,error}=await sb.from(table).select('*').order('updated_at',{ascending:false});if(error)throw error;return (data||[]).map(r=>store==='customers'?{id:r.id,name:r.name,phone:r.phone,stage:r.stage,budgetVnd:Number(r.budget_vnd||0),budgetDisplay:fmtVnd(r.budget_vnd),location:r.location,notes:r.notes,score:r.score,updatedAt:new Date(r.updated_at).getTime()}:{id:r.id,title:r.title,type:r.type,code:r.code,priceVnd:Number(r.price_vnd||0),priceDisplay:fmtVnd(r.price_vnd),area:r.area,width:r.width,length:r.length,bedrooms:r.bedrooms,bathrooms:r.bathrooms,floors:r.floors,district:r.district,mapUrl:r.map_url,images:Array.isArray(r.images)?r.images:[],updatedAt:new Date(r.updated_at).getTime()})};
const dbDelete=async(store,id)=>{const table=store==='customers'?'crm_customers':'crm_properties';const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error};
window.__dbSave=dbSave;window.__dbGet=dbGet;window.__dbDelete=dbDelete;
runInFrame(`DB.getAll=async function(store){return parent.__dbGet(store)};DB.save=async function(store,data){const id=await parent.__dbSave(store,data);return id};DB.delete=async function(store,id){return parent.__dbDelete(store,id)};DB.exportBackup=async function(){const data={customers:await DB.getAll('customers'),properties:await DB.getAll('properties'),exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CRM_CLOUD_BACKUP_'+Date.now()+'.json';a.click();URL.revokeObjectURL(url);UI.showToast('Đã xuất Backup Cloud JSON.')};DB.clearAll=async function(){UI.showConfirm('Xóa dữ liệu Cloud','Thao tác này xóa toàn bộ dữ liệu CRM của tài khoản.',async()=>{await parent.sb.from('crm_customers').delete().eq('user_id','${user.id}');await parent.sb.from('crm_properties').delete().eq('user_id','${user.id}');await State.load();UI.showToast('Đã xóa dữ liệu CRM.')})};State.load();void 0`);
if(localStorage.getItem('crm_cloud_migrated_'+user.id)!=='1'&&(localCustomers.length||localProperties.length)){for(const c of localCustomers)await dbSave('customers',c);for(const p of localProperties)await dbSave('properties',p);localStorage.setItem('crm_cloud_migrated_'+user.id,'1');}
await new Promise(r=>setTimeout(r,50));runInFrame('State.load()');gate.style.display='none';userbar.style.display='block';useremail.textContent=user.email||'';}
frame.addEventListener('load',async()=>{frameReady=true;const {data:{session}}=await sb.auth.getSession();if(session?.user){try{await sb.from('crm_profiles').upsert({user_id:session.user.id,display_name:session.user.user_metadata?.full_name||session.user.email?.split('@')[0]||'Môi giới'});}catch(e){}await bridge(session.user)}else gate.style.display='flex';});
submit.onclick=async()=>{msg.className='error';msg.textContent='';submit.disabled=true;try{const e=email.value.trim(),p=password.value;if(!e||!p)throw new Error('Nhập email và mật khẩu.');let result;if(mode==='login')result=await sb.auth.signInWithPassword({email:e,password:p});else result=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:nameEl.value.trim()||e.split('@')[0]}}});if(result.error)throw result.error;if(!result.data.session){msg.className='ok';msg.textContent='Đăng ký thành công. Hãy kiểm tra email để xác nhận rồi đăng nhập.';return}await bridge(result.data.user)}catch(err){msg.textContent=err.message||'Không thể đăng nhập.'}finally{submit.disabled=false}};
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.channel('crm-cloud-shell').on('postgres_changes',{event:'*',schema:'public',table:'crm_customers'},()=>{if(currentUser)runInFrame('State.load()')}).on('postgres_changes',{event:'*',schema:'public',table:'crm_properties'},()=>{if(currentUser)runInFrame('State.load()')}).subscribe();
</script></body></html>
